<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I love you too<title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #ffb6c196;
        font-family: "Arial", sans-serif;
        flex-direction: column;
      }

      .container {
        text-align: center;
      }

      h1 {
        font-size: 2.5em;
        color: #d32f2f;
      }

      .gif_container img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        margin-top: 20px;
        mix-blend-mode: color-burn;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>I love you too</h1>
      <div class="gif_container">
        <img src="gifs/heart.gif" alt="Cute GIF" />
      </div>
    </div>
  </body>
</html>
